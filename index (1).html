<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPoll – live polls for your classroom</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--ink:#17233D;--card:#fff;--line:#D5DDE8;--mute:#5E6B82;--pri:#2B50D8;--pri-ink:#fff;--ok:#1F8F5F;--warn:#E5A100;--bad:#C93B3B;--bar:#9DB3F5}
@media(prefers-color-scheme:dark){:root{--bg:#0F172A;--ink:#E7ECF6;--card:#18233D;--line:#2B3A5C;--mute:#9AA8C4;--pri:#6F8DFF;--pri-ink:#0F172A;--bar:#3A4F95}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:2.2rem;font-weight:800}h2{font-size:1.4rem}h3{font-size:1.1rem}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:var(--pri-ink);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.ok{background:var(--ok);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.grow{flex:1 1 200px!important}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:600;background:var(--line);color:var(--ink)}
.pill.live{background:var(--ok);color:#fff}.pill.closed{background:var(--bad);color:#fff}
.mute{color:var(--mute)}.small{font-size:.9rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;background:var(--bg);color:var(--ink);border:2px solid var(--line);font-size:1.05rem}
.opt.sel{border-color:var(--pri);background:var(--card);box-shadow:inset 6px 0 0 var(--pri)}
.bar{position:relative;margin:8px 0;border-radius:8px;background:var(--bg);overflow:hidden;min-height:40px;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--bar);transition:width .5s}
.bar span{position:relative;display:flex;justify-content:space-between;padding:8px 12px;gap:10px}
.bar.mine{border-color:var(--pri);border-width:2px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.q.active{border-color:var(--ok);border-width:2px}
.ans{padding:8px 10px;margin:6px 0;background:var(--bg);border-radius:8px}
.hide{display:none!important}
.big{font-size:2.6rem;font-weight:800;font-family:'Bricolage Grotesque'}
.code{font-family:'Bricolage Grotesque';font-size:1.6rem;font-weight:800;letter-spacing:.12em;background:var(--bg);padding:2px 12px;border-radius:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
.banner{background:#FFF4D1;color:#5A4300;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.92rem}
</style>
</head>
<body>
<main>
 <div class="top"><div class="logo">ClassPoll</div><div id="topright"></div></div>
 <div id="banner"></div>
 <div id="app"></div>
</main>
<div id="toast" class="toast hide"></div>

<script>
/* ============ CONFIG ============
 Paste your Firebase Realtime Database URL below so polls are shared across devices.
 Example: "https://my-class-default-rtdb.firebaseio.com"
 Leave empty = DEMO MODE (works only between tabs of one browser, good for testing). */
const DATABASE_URL = "";
/* ================================ */

const DEMO = !DATABASE_URL;
const POLL_MS = 2000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const ls = {get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};

/* ---------- storage layer (Firebase REST or local demo) ---------- */
const keys = p => p.split('/').filter(Boolean);
const store = {
  async get(path){
    if(DEMO){ let o = ls.get('classpoll_db')||{}; for(const k of keys(path)){ if(o==null) return null; o=o[k]; } return o ?? null; }
    const r = await fetch(`${DATABASE_URL}/${path}.json`); if(!r.ok) throw new Error('Database error '+r.status); return r.json();
  },
  async set(path, val){
    if(DEMO){ const root = ls.get('classpoll_db')||{}; const ks = keys(path); let o = root;
      ks.slice(0,-1).forEach(k=>{ if(typeof o[k]!=='object'||o[k]===null) o[k]={}; o=o[k]; });
      if(val===null) delete o[ks.at(-1)]; else o[ks.at(-1)] = val; ls.set('classpoll_db', root); return; }
    const r = await fetch(`${DATABASE_URL}/${path}.json`, val===null ? {method:'DELETE'} : {method:'PUT', body:JSON.stringify(val)});
    if(!r.ok) throw new Error('Database error '+r.status);
  }
};
const arr = o => o ? (Array.isArray(o) ? o.filter(Boolean) : Object.values(o)) : [];

/* ---------- state ---------- */
let role = null, code = null, room = null, sid = ls.get('classpoll_sid') || (ls.set('classpoll_sid', uid()), ls.get('classpoll_sid'));
let studentName = ls.get('classpoll_name') || '';
let timer = null, lastSig = '', composerType = 'mc';

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add('hide'),2400); }
function setBanner(){ $('#banner').innerHTML = DEMO ? '<div class="banner"><b>Demo mode:</b> data is stored only in this browser (open a second tab to try the student view). Add a Firebase URL in <code>index.html</code> to use it with real students.</div>' : ''; }
const R = (suffix='') => `rooms/${code}${suffix}`;

/* ---------- home ---------- */
function home(){
  stop(); role=null; code=null; room=null; $('#topright').innerHTML='';
  const savedT = ls.get('classpoll_teacher');
  $('#app').innerHTML = `
  <h1>Ask. Answer. See it live.</h1>
  <p class="mute">Create a poll room, push questions to your class, and watch responses arrive in real time.</p>
  <div class="tabs"><button id="tS">I'm a student</button><button class="alt" id="tT">I'm a teacher</button></div>
  <div id="stu" class="card">
    <h2>Join a class</h2>
    <label for="jc">Room code</label><input id="jc" maxlength="8" autocapitalize="characters" placeholder="e.g. MATH7">
    <label for="jn">Your name</label><input id="jn" value="${esc(studentName)}" placeholder="First name">
    <p><button id="jb">Join</button></p>
  </div>
  <div id="tea" class="card hide">
    <h2>Teacher</h2>
    <label for="tc">Room code</label><input id="tc" maxlength="8" autocapitalize="characters" placeholder="Choose a short code" value="${esc(savedT?.code||'')}">
    <label for="tp">Teacher PIN</label><input id="tp" type="password" placeholder="Needed to manage the room" value="${esc(savedT?.pin||'')}">
    <p class="row"><button id="tcreate">Create room</button><button class="alt" id="tlogin">Open my room</button></p>
    <p class="small mute">Create makes a new room with this PIN. Open my room signs you back in.</p>
  </div>`;
  $('#tS').onclick=()=>{$('#stu').classList.remove('hide');$('#tea').classList.add('hide');$('#tS').classList.remove('alt');$('#tT').classList.add('alt')};
  $('#tT').onclick=()=>{$('#tea').classList.remove('hide');$('#stu').classList.add('hide');$('#tT').classList.remove('alt');$('#tS').classList.add('alt')};
  $('#jb').onclick=joinStudent;
  $('#tcreate').onclick=()=>teacherEnter(true);
  $('#tlogin').onclick=()=>teacherEnter(false);
  const q = new URLSearchParams(location.search).get('room'); if(q){ $('#jc').value=q.toUpperCase(); }
}
async function joinStudent(){
  const c = $('#jc').value.trim().toUpperCase(), n = $('#jn').value.trim();
  if(!c||!n) return toast('Enter the room code and your name');
  try{ const r = await store.get(`rooms/${c}`); if(!r) return toast('No room with that code'); }catch(e){ return toast(e.message); }
  code=c; role='student'; studentName=n; ls.set('classpoll_name', n); startPolling();
}
async function teacherEnter(create){
  const c = $('#tc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''), p = $('#tp').value;
  if(!c||p.length<4) return toast('Enter a code and a PIN of at least 4 characters');
  try{
    const r = await store.get(`rooms/${c}`);
    if(create){ if(r) return toast('That code is taken – pick another or open it'); 
      await store.set(`rooms/${c}`, {pin:p, title:'My class poll', activeQ:'', accepting:true, showResults:false, anonymous:false, created:Date.now()}); }
    else { if(!r) return toast('Room not found'); if(r.pin!==p) return toast('Wrong PIN'); }
  }catch(e){ return toast(e.message); }
  ls.set('classpoll_teacher',{code:c,pin:p}); code=c; role='teacher'; startPolling();
}

/* ---------- polling ---------- */
function startPolling(){ stop(); lastSig=''; $('#app').innerHTML='<p class="mute">Loading…</p>'; tick(); timer=setInterval(tick,POLL_MS);
  $('#topright').innerHTML = `<button class="alt" id="leave">Leave</button>`; $('#leave').onclick=home; }
function stop(){ clearInterval(timer); timer=null; }
async function tick(){
  if(!code) return;
  try{ const r = await store.get(`rooms/${code}`);
    if(!r){ toast('Room was deleted'); return home(); }
    room = r; const sig = JSON.stringify(r); if(sig===lastSig) return; lastSig=sig; render(); }
  catch(e){ console.error(e); }
}
function render(){ role==='teacher' ? renderTeacher() : renderStudent(); }

/* ---------- helpers ---------- */
const questions = () => arr(room.questions).sort((a,b)=>a.created-b.created);
const responsesFor = qid => { const o = room.responses?.[qid] || {}; return Object.entries(o).map(([k,v])=>({sid:k,...v})); };
const optionsOf = q => q.type==='rating' ? ['1','2','3','4','5'] : arr(q.options);
function resultsHTML(q, mineSid, showNames){
  const rs = responsesFor(q.id), n = rs.length;
  if(q.type==='text'){
    return `<p class="mute small">${n} response${n===1?'':'s'}</p>` + (n? rs.map(r=>`<div class="ans">${esc(r.answer)}${showNames?` <span class="mute small">— ${esc(r.name)}</span>`:''}</div>`).join('') : '');
  }
  const opts = optionsOf(q), counts = opts.map((o,i)=>rs.filter(r=>String(r.answer)===String(i)).length);
  const mine = rs.find(r=>r.sid===mineSid)?.answer;
  let html = `<p class="mute small">${n} response${n===1?'':'s'}${q.type==='rating'&&n?` · average ${(rs.reduce((a,r)=>a+(+r.answer+1),0)/n).toFixed(1)} / 5`:''}</p>`;
  html += opts.map((o,i)=>{ const pct = n? Math.round(counts[i]/n*100):0;
    return `<div class="bar ${String(mine)===String(i)?'mine':''}"><i style="width:${pct}%"></i><span><b>${esc(o)}</b><span>${counts[i]} · ${pct}%</span></span></div>`; }).join('');
  if(showNames && n){ html += `<details><summary class="small mute">Who answered what</summary>${rs.map(r=>`<div class="small">${esc(r.name)}: ${esc(opts[+r.answer]??'')}</div>`).join('')}</details>`; }
  return html;
}

/* ---------- teacher ---------- */
let teacherBuilt = false;
function renderTeacher(){
  const qs = questions(), joinUrl = location.origin+location.pathname+'?room='+code;
  const active = qs.find(q=>q.id===room.activeQ);
  if(!teacherBuilt || !$('#qlist')){
    $('#app').innerHTML = `
    <div class="card">
      <div class="row"><div class="grow"><span class="mute small">Room code</span><br><span class="code">${esc(code)}</span></div>
        <button class="alt" id="cp">Copy student link</button></div>
      <label for="rt">Poll title</label><input id="rt" value="${esc(room.title)}">
    </div>
    <div class="card">
      <h2>Class controls</h2>
      <div class="row">
        <button id="tAcc"></button><button id="tRes"></button><button id="tAnon"></button>
      </div>
      <div class="row" style="margin-top:10px"><button class="alt" id="exp">Export CSV</button><button class="alt bad" id="clr">Clear all responses</button><button class="alt bad" id="delr">Delete room</button></div>
    </div>
    <div class="card"><h2>Add a question</h2>
      <label for="qt">Question</label><textarea id="qt" rows="2" placeholder="What is 7 × 8?"></textarea>
      <label for="qty">Type</label>
      <select id="qty"><option value="mc">Multiple choice</option><option value="rating">Rating 1–5</option><option value="text">Short written answer</option></select>
      <div id="optwrap"><label for="qo">Options (one per line)</label><textarea id="qo" rows="4" placeholder="54&#10;56&#10;63"></textarea></div>
      <p><button id="addq">Add question</button></p>
    </div>
    <h2>Questions</h2><div id="qlist"></div>`;
    teacherBuilt = true;
    $('#cp').onclick=()=>{navigator.clipboard?.writeText(joinUrl); toast('Link copied')};
    $('#rt').onchange=e=>store.set(R('/title'), e.target.value.trim()||'My class poll');
    $('#tAcc').onclick=()=>set('accepting', !room.accepting);
    $('#tRes').onclick=()=>set('showResults', !room.showResults);
    $('#tAnon').onclick=()=>set('anonymous', !room.anonymous);
    $('#qty').onchange=e=>$('#optwrap').classList.toggle('hide', e.target.value!=='mc');
    $('#addq').onclick=addQuestion; $('#exp').onclick=exportCSV;
    $('#clr').onclick=async()=>{ if(confirm('Delete every response in this room?')){ await store.set(R('/responses'),null); toast('Responses cleared'); tick(); } };
    $('#delr').onclick=async()=>{ if(confirm('Delete this whole room and all questions?')){ await store.set(R(),null); ls.del('classpoll_teacher'); home(); } };
  }
  $('#tAcc').textContent = room.accepting ? 'Pause answers' : 'Resume answers';
  $('#tRes').textContent = room.showResults ? 'Hide results from students' : 'Show results to students';
  $('#tAnon').textContent = room.anonymous ? 'Names hidden from you: ON' : 'Hide student names';
  $('#tAcc').className = room.accepting ? 'alt' : 'ok'; $('#tRes').className = room.showResults ? 'ok' : 'alt'; $('#tAnon').className = room.anonymous ? 'ok':'alt';
  $('#qlist').innerHTML = qs.length ? qs.map((q,i)=>{
    const live = q.id===room.activeQ;
    return `<div class="q ${live?'active':''}" data-id="${q.id}">
      <div class="row"><h3 class="grow">${i+1}. ${esc(q.text)}</h3>${live?`<span class="pill live">${room.accepting?'Live':'Paused'}</span>`:''}</div>
      ${live || q.showOnly ? resultsHTML(q,null,!room.anonymous) : `<span class="pill">${responsesFor(q.id).length} responses</span>`}
      <div class="row" style="margin-top:10px">
        ${live?`<button class="alt" data-a="stop">Stop question</button>`:`<button data-a="push">Push to students</button>`}
        <button class="alt" data-a="view">${q.showOnly?'Hide results':'View results'}</button>
        <button class="alt" data-a="reset">Reset responses</button>
        <button class="alt" data-a="edit">Edit</button>
        <button class="alt bad" data-a="del">Delete</button>
      </div></div>`; }).join('') : '<p class="mute">No questions yet. Add one above.</p>';
  $('#qlist').onclick = qaction;
}
const set = async (k,v)=>{ await store.set(R('/'+k), v); tick(); };
async function addQuestion(){
  const text = $('#qt').value.trim(), type = $('#qty').value;
  const opts = $('#qo').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!text) return toast('Write the question first');
  if(type==='mc' && opts.length<2) return toast('Multiple choice needs at least 2 options');
  const id = 'q'+uid(), q = {id, text, type, created:Date.now()}; if(type==='mc') q.options = opts;
  await store.set(R('/questions/'+id), q); $('#qt').value=''; $('#qo').value=''; toast('Question added'); tick();
}
async function qaction(e){
  const b = e.target.closest('button[data-a]'); if(!b) return;
  const id = b.closest('.q').dataset.id, q = questions().find(x=>x.id===id), a = b.dataset.a;
  if(a==='push'){ await store.set(R('/activeQ'), id); await store.set(R('/accepting'), true); }
  else if(a==='stop'){ await store.set(R('/activeQ'), ''); }
  else if(a==='view'){ await store.set(R(`/questions/${id}/showOnly`), q.showOnly?null:true); }
  else if(a==='reset'){ if(confirm('Reset responses for this question?')) await store.set(R('/responses/'+id), null); }
  else if(a==='del'){ if(confirm('Delete this question?')){ await store.set(R('/questions/'+id), null); await store.set(R('/responses/'+id), null); if(room.activeQ===id) await store.set(R('/activeQ'),''); } }
  else if(a==='edit'){ const t = prompt('Edit question text', q.text); if(t&&t.trim()) await store.set(R(`/questions/${id}/text`), t.trim());
    if(q.type==='mc' && t && confirm('Also edit the options? (this resets answers to this question)')){
      const o = prompt('Options, separated by | ', arr(q.options).join(' | ')); const list = (o||'').split('|').map(s=>s.trim()).filter(Boolean);
      if(list.length>=2){ await store.set(R(`/questions/${id}/options`), list); await store.set(R('/responses/'+id), null); } } }
  tick();
}
function exportCSV(){
  const rows = [['Question','Type','Student','Answer','Time']];
  questions().forEach(q=>{ const opts=optionsOf(q); responsesFor(q.id).forEach(r=>rows.push([q.text,q.type,room.anonymous?'(hidden)':r.name,q.type==='text'?r.answer:(opts[+r.answer]??''),new Date(r.t).toISOString()])); });
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `classpoll-${code}.csv`; a.click();
}

/* ---------- student ---------- */
function renderStudent(){
  const q = questions().find(x=>x.id===room.activeQ);
  const draft = $('#ta')?.value;
  let html = `<p class="mute">${esc(room.title)} · joined as <b>${esc(studentName)}</b></p>`;
  if(!q){ html += `<div class="card"><h2>Waiting for the next question…</h2><p class="mute">Your teacher will push a question here. This page updates by itself.</p></div>`; }
  else {
    const mine = room.responses?.[q.id]?.[sid]; const open = room.accepting;
    html += `<div class="card"><span class="pill ${open?'live':'closed'}">${open?'Open':'Answers paused'}</span><h2 style="margin-top:8px">${esc(q.text)}</h2>`;
    if(q.type==='text'){
      html += `<textarea id="ta" rows="3" maxlength="400" ${open?'':'disabled'} placeholder="Type your answer">${esc(mine?.answer||'')}</textarea>
        <p><button id="sub" ${open?'':'disabled'}>${mine?'Update answer':'Submit answer'}</button></p>`;
    } else {
      html += optionsOf(q).map((o,i)=>`<button class="opt ${mine&&String(mine.answer)===String(i)?'sel':''}" data-i="${i}" ${open?'':'disabled'}>${esc(o)}</button>`).join('');
    }
    if(mine) html += `<p class="small" style="color:var(--ok)">✓ Answer saved${open?' – you can change it until the teacher pauses.':''}</p>`;
    html += `</div>`;
    if(room.showResults) html += `<div class="card"><h3>Class results</h3>${resultsHTML(q,sid,false)}</div>`;
  }
  $('#app').innerHTML = html;
  if(draft!==undefined && $('#ta') && document.activeElement?.id!=='ta' && draft!==(room.responses?.[q?.id]?.[sid]?.answer||'')) $('#ta').value = draft;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,b.dataset.i));
  $('#sub') && ($('#sub').onclick=()=>{ const v=$('#ta').value.trim(); if(!v) return toast('Write an answer first'); answer(q,v); });
}
async function answer(q, val){
  if(!room.accepting) return toast('Answers are paused');
  try{ await store.set(R(`/responses/${q.id}/${sid}`), {name:studentName, answer:val, t:Date.now()}); toast('Answer saved'); tick(); }
  catch(e){ toast('Could not save – check your connection'); }
}

/* ---------- boot ---------- */
setBanner(); home();
</script>
</body>
</html>
